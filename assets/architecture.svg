      <text x="1052" y="362">.java kaynakları</text>
      <text x="1052" y="470">target/classes, jar</text>
      <text x="1052" y="578">Terminal, dosya</text>
    </g>

    <path d="M64 740H110" fill="none" stroke="#ff9975" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="126" y="747" fill="#e1e8e3" font-size="18">Oklar kod bağımlılığını gösterir; hepsi içe yönelir.</text>
    <rect x="720" y="726" width="60" height="28" rx="14" fill="#202c30" stroke="#ff9975" stroke-width="2.5"/>
    <text x="796" y="747" fill="#e1e8e3" font-size="18">Port: çekirdeğin dışarıdan istediği sözleşme</text>
    <text x="64" y="800" fill="#a5b8af" font-size="15">Altıgen mimari (ports &amp; adapters) · Alistair Cockburn</text>
  </g>
</svg>

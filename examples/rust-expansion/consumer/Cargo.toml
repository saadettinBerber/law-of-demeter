[package]
name = "expansion-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
expansion-legacy = { path = "../legacy" }
expansion-generator = { path = "../generator" }

[features]
alternate = []
attr-probe = []
cfg-probe = []
proc-probe = []

[[example]]
name = "cfg_attr"
